name: Deploy to test Supabase

on:
  push:
    branches: [dev]

permissions:
  contents: read
  actions: read

jobs:
  verify-ci:
    name: Verify Dev CI Completion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Wait for and verify commit-specific CI completion (all 6 jobs)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Locating CI workflow (ci.yml) for commit ${{ github.sha }} on dev..."

          # 1. Wait for CI workflow run to be registered (up to 60s)
          RUN_ID=""
          for i in $(seq 1 12); do
            RUN_JSON=$(gh run list --workflow=ci.yml --branch=dev --commit="${{ github.sha }}" --json databaseId,status,conclusion,url,event,headBranch,headSha,workflowName --limit 1 --jq '.[0]')
            if [ -n "$RUN_JSON" ] && [ "$RUN_JSON" != "null" ]; then
              RUN_ID=$(echo "$RUN_JSON" | jq -r .databaseId)
              break
            fi
            echo "Waiting for CI run to appear on GitHub Actions (attempt $i/12)..."
            sleep 5
          done

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "Error: No CI workflow run found for commit ${{ github.sha }} on dev within 60s."
            echo "Deployment blocked. CI must be queued or completed for this commit before deploying."
            exit 1
          fi

          URL=$(echo "$RUN_JSON" | jq -r .url)
          BRANCH=$(echo "$RUN_JSON" | jq -r .headBranch)
          HEAD_SHA=$(echo "$RUN_JSON" | jq -r .headSha)
          WORKFLOW_NAME=$(echo "$RUN_JSON" | jq -r .workflowName)

          echo "Found CI Run ID: $RUN_ID ($URL)"
          echo "Workflow: $WORKFLOW_NAME | Branch: $BRANCH | Head SHA: $HEAD_SHA"

          # 2. Strict metadata validations
          if [ "$WORKFLOW_NAME" != "CI" ]; then
            echo "Error: CI run workflow '$WORKFLOW_NAME' does not match expected 'CI'."
            exit 1
          fi

          if [ "$BRANCH" != "dev" ]; then
            echo "Error: CI run was executed for branch '$BRANCH', expected 'dev'."
            exit 1
          fi

          if [ "$HEAD_SHA" != "${{ github.sha }}" ]; then
            echo "Error: CI run head SHA '$HEAD_SHA' does not match deployment target '${{ github.sha }}'."
            exit 1
          fi

          # 3. Poll until CI run completes (timeout 12 minutes)
          echo "Waiting for CI run $RUN_ID to complete..."
          STATUS=$(echo "$RUN_JSON" | jq -r .status)
          CONCLUSION=$(echo "$RUN_JSON" | jq -r .conclusion)

          for i in $(seq 1 72); do
            if [ "$STATUS" = "completed" ]; then
              break
            fi
            echo "CI run status: $STATUS (polling attempt $i/72)..."
            sleep 10
            RUN_JSON=$(gh run view "$RUN_ID" --json status,conclusion --jq '.')
            STATUS=$(echo "$RUN_JSON" | jq -r .status)
            CONCLUSION=$(echo "$RUN_JSON" | jq -r .conclusion)
          done

          echo "CI run completed with Status: $STATUS | Conclusion: $CONCLUSION"

          # 4. Enforce overall run completed with success
          if [ "$STATUS" != "completed" ] || [ "$CONCLUSION" != "success" ]; then
            echo "Error: CI run for commit ${{ github.sha }} did not complete successfully (status: $STATUS, conclusion: $CONCLUSION)."
            echo "Deployment blocked. All CI checks must pass on dev before deploying to test."
            exit 1
          fi

          # 5. Verify all 6 individual required CI jobs are represented and successful
          echo "Verifying all 6 required jobs in CI run $RUN_ID..."
          JOBS_JSON=$(gh run view "$RUN_ID" --json jobs --jq '.jobs')

          REQUIRED_JOBS=(
            "Environment hygiene"
            "Edge-function contract tests"
            "TypeScript type check"
            "Vite build"
            "Supabase migration lint"
            "Secret detection"
          )

          for job in "${REQUIRED_JOBS[@]}"; do
            JOB_CONCLUSION=$(echo "$JOBS_JSON" | jq -r --arg n "$job" '.[] | select(.name == $n) | .conclusion')
            if [ -z "$JOB_CONCLUSION" ] || [ "$JOB_CONCLUSION" = "null" ]; then
              echo "Error: Required CI job '$job' was not found in CI run $RUN_ID."
              exit 1
            fi
            if [ "$JOB_CONCLUSION" != "success" ]; then
              echo "Error: Required CI job '$job' did not succeed (conclusion: '$JOB_CONCLUSION')."
              exit 1
            fi
            echo "  [OK] $job: $JOB_CONCLUSION"
          done

          echo "Dev CI verification passed successfully: all 6 jobs completed with success."

  deploy:
    name: Deploy to Test Supabase
    needs: [verify-ci]
    uses: ./.github/workflows/deploy-supabase.yml
    with:
      project-ref: ofvfasdgdwkehdcjugnf
    secrets:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_TEST }}
