name: Deploy to prod Supabase

on:
  push:
    branches: [main]

jobs:
  deploy:
    uses: ./.github/workflows/deploy-supabase.yml
    with:
      project-ref: vdxspyumkvwawmqwfkzr
    secrets:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
